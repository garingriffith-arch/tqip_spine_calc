name: Archive integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install checksum dependency
        run: Rscript -e 'install.packages("digest", repos="https://cloud.r-project.org")'
      - name: Verify source archive
        run: Rscript analytic_pipeline/verify_archive.R
      - name: Verify published deployment artifacts
        run: Rscript analytic_pipeline/verify_deployment_artifacts.R
